# ============================================================
# PROMETHEUS CONFIGURATION
# ============================================================
# Monitors all services in the MT Optimizer stack
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "mt-optimizer-prod"
    environment: "production"

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - 'alertmanager:9093'

# Rule files (for alerts)
# rule_files:
#   - 'alerts/*.yml'

scrape_configs:
  # FastAPI Backend Metrics
  - job_name: "fastapi"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  # Celery Worker Metrics (via Flower)
  - job_name: "celery"
    static_configs:
      - targets: ["flower:5555"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  # PostgreSQL Metrics (requires postgres_exporter)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]
    scrape_interval: 30s
    # Note: You may need to add postgres_exporter as a sidecar

  # Redis Metrics (requires redis_exporter)
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
    scrape_interval: 30s
    # Note: You may need to add redis_exporter as a sidecar

  # Node Exporter (for system metrics - optional)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 30s

  # MinIO Metrics
  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
    scrape_interval: 30s
